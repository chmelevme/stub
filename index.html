<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midimaks.ru | Домен в разработке</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1e2f 0%, #0f0f15 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
            position: relative;
            z-index: 2;
        }
        .logo-area {
            margin-bottom: 30px;
        }
        .logo-icon {
            font-size: 4rem;
            animation: float 4s ease-in-out infinite;
            display: inline-block;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #8fa0dd;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: #4facfe;
            border-color: #4facfe;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
            transform: translateY(-2px);
        }
        .btn-primary {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #0f0f15;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
        }
        /* Background decor elements */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #4facfe;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 1;
            top: 20%;
            left: 20%;
            animation: pulse 8s ease-in-out infinite alternate;
        }
        .glow-orb-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            background: #00f2fe;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.12;
            z-index: 1;
            bottom: 20%;
            right: 20%;
            animation: pulse 6s ease-in-out infinite alternate-reverse;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>

    <div class="container">
        <div class="logo-area">
            <span class="logo-icon">🚀</span>
        </div>
        <h1>midimaks.ru</h1>
        <p>Этот домен временно отдыхает, но здесь обязательно появится что-то крутое. Проект находится в процессе разработки.</p>
        
        <div class="links">
            <a href="https://github.com" class="btn btn-primary" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="mailto:hello@midimaks.ru" class="btn">Связаться</a>
        </div>
    </div>
</body>
</html>
